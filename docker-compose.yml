services:
  pdf-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pdf-service-app
    ports:
      - "5038:5038"
    environment:
      - REDIS_CONNECTION_STRING=redis:6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - REDIS_JOB_TTL_HOURS=1
      - REDIS_FAILED_JOB_TTL_HOURS=24
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: pdf-service-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
    driver: local
